<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="farmixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2316"/>
      <stop offset="100%" stop-color="#05120a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#farmixBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#34d399" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Glowing Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="#34d399" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Signature Stylized Sprout / Neural Leaf -->
  <path d="M256 100 C 350 140, 400 240, 360 340 C 330 410, 260 412, 256 412 C 252 412, 182 410, 152 340 C 112 240, 162 140, 256 100 Z" fill="url(#leafGrad)"/>
  
  <!-- Central Vein / Upward Spire -->
  <path d="M256 120 L256 390" stroke="#062817" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Left Neural Branches -->
  <path d="M256 220 C 220 200, 190 220, 180 250" stroke="#062817" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 280 C 230 270, 210 290, 200 320" stroke="#062817" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right Golden Grain Nodes -->
  <circle cx="300" cy="210" r="12" fill="url(#goldGrad)"/>
  <circle cx="325" cy="270" r="10" fill="url(#goldGrad)"/>
  <circle cx="295" cy="330" r="8" fill="url(#goldGrad)"/>
  
  <!-- Connecting Synapse Lines -->
  <path d="M256 220 L300 210 M256 280 L325 270 M256 340 L295 330" stroke="#062817" stroke-width="6" stroke-linecap="round"/>
</svg>

